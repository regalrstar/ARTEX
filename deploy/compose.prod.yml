# Production compose for a rented scan box.
# Differences from the local file: loopback-only ports, named volumes, no host
# bind mounts, log caps. Set ARTEX_CPUSET / WIFI_CPUSET only on hosts large enough
# for them (e.g. 0-11 / 12-15 on 16 vCPU); leave empty on 4-8 vCPU boxes.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  artex:
    image: artex:local
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_JWT_KEY_DIR: /app/keys
    ports:
      - "127.0.0.1:8787:8787"   # reach it through an SSH tunnel only
      - "127.0.0.1:8788:8788"
    volumes:
      - data:/app/data
      - keys:/app/keys
    cpuset: ${ARTEX_CPUSET:-}
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  wifi:
    image: artex:local
    entrypoint: ["python3", "/opt/wifi/server.py"]
    depends_on: [artex]
    environment:
      ARTEX_URL: http://artex:8787
      ARTEX_PASS: ${ARTEX_ADMIN_PASSWORD:-}
      WIFI_DATA: /data
      WIFI_WORDLISTS: /wordlists
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - wifidata:/data
      - wordlists:/wordlists:ro
      - ./wifi:/opt/wifi:ro
    cpuset: ${WIFI_CPUSET:-}
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  pgdata:
  data:
  keys:
  wifidata:
  wordlists:
